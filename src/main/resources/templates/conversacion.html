<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mensajes')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container py-4">
        <a class="volver" th:href="@{/conversaciones}">← Mis mensajes</a>
        <div class="row justify-content-center mt-3 con-formas formas-b formas-hilo">
            <div class="col-lg-8">

                <div class="caja-estado" th:if="${conv.id != null}">
                    <form th:if="${conv.estado.usuarioPuedeSolicitar}"
                        th:action="@{/conversaciones/{id}/estado(id=${conv.id})}" method="post">
                        <input type="hidden" name="estado" value="SOLICITADA">
                        <button type="submit" class="btn btn-pill btn-menta">Solicitar esta pieza</button>
                    </form>
                    <form th:if="${conv.estado.usuarioPuedeCancelar}"
                        th:action="@{/conversaciones/{id}/estado(id=${conv.id})}" method="post"
                        data-confirmar="¿Seguro que quieres cancelar? No se puede deshacer.">
                        <input type="hidden" name="estado" value="CANCELADA">
                        <button type="submit" class="btn btn-pill btn-borde">Cancelar</button>
                    </form>
                    <span class="small text-secondary" th:unless="${conv.estado.usuarioPuedeCancelar}"
                        th:text="'Estado: ' + ${conv.estado.etiqueta}">Estado</span>

                    <p class="caja-estado-ayuda" th:if="${conv.estado.usuarioPuedeSolicitar}">
                        Puedes usar el chat para resolver dudas o concretar detalles. Pulsa
                        <strong>Solicitar esta pieza</strong> cuando quieras pedirla formalmente para que te
                        indiquemos el precio acordado.
                    </p>
                    <p class="caja-estado-ayuda"
                        th:if="${!conv.estado.usuarioPuedeSolicitar and conv.estado.usuarioPuedeCancelar}">
                        Ya has enviado tu solicitud: el equipo la revisará para indicarte el precio acordado.
                    </p>
                </div>

                <th:block th:replace="~{fragments/hilo :: hilo(${conv}, ${vistaGuarida}, ${accion})}"></th:block>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/layout :: footer}"></th:block>

    <!-- Modal para ampliar cualquier imagen de referencia -->
    <div class="modal" id="modalImagenReferencia" tabindex="-1" aria-labelledby="tituloModalReferencia"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-2">
                    <h5 class="modal-title fw-bold" id="tituloModalReferencia">Imagen de referencia</h5>
                    <button type="button" class="btn-close" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center pt-0">
                    <img id="imgReferenciaAmpliada" src="" alt="Vista ampliada de referencia"
                        class="img-fluid rounded-3" style="max-height: 75vh; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/conversacion.js}"></script>
</body>

</html>

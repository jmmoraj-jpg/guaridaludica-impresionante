<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
        <div class="auth">
            <div class="auth-card con-formas formas-b">
                <h2 class="mb-3 titulo-marcador marcador-lila">Crea tu cuenta</h2>

                <form th:action="@{/registro}" th:object="${registro}" method="post" novalidate>
                    <div class="mb-3">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control">
                        <div class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control">
                        <div class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control">
                        <div class="error-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmarPassword">Repite la contraseña</label>
                        <input type="password" id="confirmarPassword" th:field="*{confirmarPassword}"
                            class="form-control">
                        <div class="error-campo" th:if="${#fields.hasErrors('confirmarPassword')}"
                            th:errors="*{confirmarPassword}"></div>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" id="aceptaPrivacidad" th:field="*{aceptaPrivacidad}"
                            class="form-check-input">
                        <label for="aceptaPrivacidad" class="form-check-label">
                            He leído y acepto la
                            <a th:href="@{/privacidad}" target="_blank" rel="noopener">política de privacidad</a>
                        </label>
                        <div class="error-campo" th:if="${#fields.hasErrors('aceptaPrivacidad')}"
                            th:errors="*{aceptaPrivacidad}"></div>
                    </div>
                    <button type="submit" class="btn btn-pill btn-menta w-100">Crear cuenta</button>
                </form>

                <p class="text-center mt-3 mb-0 text-secondary">
                    ¿Ya tienes cuenta? <a th:href="@{/login}">Entrar</a>
                </p>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>

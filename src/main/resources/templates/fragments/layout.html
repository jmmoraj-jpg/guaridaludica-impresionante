<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · La Guarida Maker'">La Guarida Maker</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/catalogo.css}">
    <link rel="stylesheet" th:href="@{/css/pieza.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/conversaciones.css}">
</head>

<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-guarida">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/img/logo-horizontal.svg}" alt="Logo de La Guarida Maker">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" th:href="@{/#catalogo}">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/#como-funciona}">Cómo funciona</a></li>

                    <th:block sec:authorize="!isAuthenticated()">
                        <li class="nav-item"><a class="nav-link" th:href="@{/login}">Entrar</a></li>
                        <li class="nav-item ms-lg-2"><a class="btn btn-pill btn-salmon" th:href="@{/registro}">Únete</a>
                        </li>
                    </th:block>
                    <th:block sec:authorize="isAuthenticated()">
                        <li class="nav-item"><a class="nav-link" th:href="@{/favoritos}">♥ Favoritos</a></li>
                        <li class="nav-item" th:with="n=${@avisos.deUsuario(#authentication.name)}">
                            <a class="nav-link" th:href="@{/conversaciones}">✉ Mensajes
                                <span class="aviso-nuevo" th:if="${n > 0}" th:text="${n}">1</span>
                            </a>
                        </li>

                        <!-- Solo administración -->
                        <li class="nav-item dropdown" sec:authorize="hasAnyRole('ADMIN','ENCARGADO')"
                            th:with="n=${@avisos.deEquipo()}">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">Administración
                                <span class="aviso-nuevo" th:if="${n > 0}" th:text="${n}">1</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">

                                <li sec:authorize="hasRole('ADMIN')">
                                    <a class="dropdown-item" th:href="@{/admin/productos}">Piezas</a>
                                </li>
                                <li sec:authorize="hasRole('ADMIN')">
                                    <a class="dropdown-item" th:href="@{/admin/categorias}">Categorías</a>
                                </li>
                                <li sec:authorize="hasRole('ADMIN')">
                                    <a class="dropdown-item" th:href="@{/admin/impresora}">Impresora</a>
                                </li>

                                <!-- Piezas y Categorías igual que antes -->
                                <li sec:authorize="hasAnyRole('ADMIN','ENCARGADO')">
                                    <a class="dropdown-item" th:href="@{/admin/mensajes}">Bandeja
                                        <span class="aviso-nuevo" th:if="${n > 0}" th:text="${n}">1</span>
                                    </a>
                                </li>
                            </ul>
                        </li>

                        <li class="nav-item"><a class="nav-link" th:href="@{/cuenta}" sec:authentication="name">usuario</a></li>
                        <li class="nav-item ms-lg-2">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-pill btn-borde">Salir</button>
                            </form>
                        </li>
                    </th:block>
                </ul>
            </div>
        </div>
    </nav>

    <th:block th:fragment="footer">
        <footer class="pie">
            <p th:text="${@environment.getProperty('app.banner.advertencia')}">Advertencia</p>
            <p><a th:href="@{/privacidad}">Política de privacidad</a></p>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>

</body>

</html>

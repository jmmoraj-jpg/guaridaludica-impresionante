<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Bandeja de mensajes')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h2 class="mb-3">Bandeja de mensajes</h2>

    <nav class="filtros" aria-label="Filtro">
        <a class="filtro" th:classappend="${!pendientes} ? 'activo'" th:href="@{/admin/mensajes}">Todas</a>
        <a class="filtro" th:classappend="${pendientes} ? 'activo'"
           th:href="@{/admin/mensajes(filtro='pendientes')}">Sin responder</a>
    </nav>

    <div class="tabla-admin">
        <table class="table align-middle mb-0">
            <thead>
            <tr><th>Usuario</th><th>Pieza</th><th>Estado</th><th>Último mensaje</th><th>Actividad</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${conversaciones}">
                <td>
                    <span class="nuevo-punto" th:if="${c.sinLeerGuarida}" title="Sin responder"></span>
                    <span th:text="${c.usuario.nombre}">Nombre</span>
                </td>
                <td th:text="${c.producto.nombre}">Pieza</td>
                <td>
                    <span class="etiqueta" th:text="${c.estado.etiqueta}"
                          th:classappend="${'estado-' + #strings.toLowerCase(c.estado.name())}">Consulta</span>
                </td>
                <td class="text-secondary small" th:text="${c.ultimoResumen}">Resumen</td>
                <td class="small" th:text="${#temporals.format(c.ultimaActividad, 'dd/MM/yyyy HH:mm')}">fecha</td>
                <td class="text-end">
                    <a th:href="@{/admin/mensajes/{id}(id=${c.id})}" class="btn btn-sm btn-pill btn-borde">Abrir</a>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${conversaciones.isEmpty()}" class="text-secondary p-3 mb-0">No hay conversaciones.</p>
    </div>

    <p class="text-secondary small mt-2" th:text="${total} + ' conversaciones'">0 conversaciones</p>
    <th:block th:replace="~{fragments/paginacion :: paginacion(${pagina}, ${totalPaginas}, '/admin/mensajes', ${extraPaginacion}, '')}"></th:block>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>

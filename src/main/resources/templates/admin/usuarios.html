<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Gestión de Usuarios')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-4">
        <div class="admin-shell">
            <aside th:replace="~{fragments/admin-layout :: sidebar('usuarios')}"></aside>

            <main class="admin-contenido">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Gestión de Usuarios</h2>
                </div>

                <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="tabla-admin">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Privacidad</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td>
                                    <div class="fw-semibold" th:text="${u.nombre}">Nombre</div>
                                    <div class="text-secondary small" th:text="${u.email}">usuario@email.com</div>
                                </td>
                                <td>
                                    <span class="badge bg-primary" th:text="${u.rol}">USUARIO</span>
                                </td>
                                <td class="small text-secondary text-nowrap"
                                    th:text="${u.fechaAceptacionPrivacidad != null ? #temporals.format(u.fechaAceptacionPrivacidad, 'dd-MM-yyyy HH:mm') : 'N/D'}">
                                    -</td>
                                <td class="text-end text-nowrap">
                                    <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}" method="post"
                                        class="d-inline"
                                        onsubmit="return confirm('¿Seguro que deseas eliminar este usuario y todos sus datos (favoritos, direcciones, conversaciones)?');">
                                        <button type="submit" class="btn btn-sm btn-pill btn-borde">Eliminar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>

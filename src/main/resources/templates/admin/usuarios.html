<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Gestión de Usuarios')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Usuarios</h2>
            <a th:href="@{/admin}" class="btn btn-secondary">Volver al Panel</a>
        </div>

        <!-- Alertas de éxito o error -->
        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Aceptación Privacidad</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.id}">1</td>
                            <td th:text="${u.nombre}">Nombre</td>
                            <td th:text="${u.email}">usuario@email.com</td>
                            <td>
                                <span class="badge bg-primary" th:text="${u.rol}">USUARIO</span>
                            </td>
                            <td
                                th:text="${u.fechaAceptacionPrivacidad != null ? #temporals.format(u.fechaAceptacionPrivacidad, 'dd-MM-yyyy HH:mm') : 'N/D'}">
                                -</td>
                            <td class="text-end">
                                <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}" method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('¿Seguro que deseas eliminar este usuario y todos sus datos (favoritos, direcciones, conversaciones)?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Administración')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Piezas</h2>
            <div class="d-flex gap-2">
                <form th:action="@{/admin/productos/recalcular-precios}" method="post" class="m-0"
                    onsubmit="return confirm('¿Recalcular coste y precio sugerido de todas las piezas?')">
                    <button type="submit" class="btn btn-pill btn-borde">Recalcular precios</button>
                </form>
                <a th:href="@{/admin/productos/nuevo}" class="btn btn-pill btn-menta">Nueva pieza</a>
            </div>
        </div>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>

        <form th:action="@{/admin/productos}" method="get" class="buscador-admin d-flex gap-2 mb-3">
            <input type="search" name="q" th:value="${q}" class="form-control" placeholder="Buscar pieza por nombre…">
            <button type="submit" class="btn btn-pill btn-menta">Buscar</button>
            <a th:if="${q != null}" th:href="@{/admin/productos}" class="btn btn-pill btn-borde">Limpiar</a>
        </form>

        <div class="tabla-admin">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th></th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Coste / Sugerido</th>
                        <th>Estado</th>
                        <th>Stock</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${productos}" th:id="'pieza-' + ${p.id}"
                        th:with="stockActual=${p.stock != null ? p.stock : 0}"
                        th:classappend="${stockActual == 0} ? 'fila-stock-cero' : (${stockActual == 1} ? 'fila-stock-uno' : '')">
                        <td style="width: 80px">
                            <img th:if="${p.imagenUrl != null}" th:src="${p.imagenUrl}" class="mini" alt="">
                        </td>
                        <td th:text="${p.nombre}">Nombre</td>
                        <td>
                            <span class="etiqueta etiqueta-categoria me-1" th:each="c : ${p.categorias}"
                                th:text="${c.nombre}">Cat</span>
                            <span class="text-secondary" th:if="${p.categorias.isEmpty()}">—</span>
                        </td>
                        <td>
                            <div th:if="${p.precioSugerido != null}">
                                <span class="fw-bold" style="color: var(--menta-oscuro, #2a8c6a);"
                                    th:text="${#numbers.formatDecimal(p.precioSugerido, 1, 'POINT', 2, 'POINT') + ' €'}">3,50
                                    €</span>
                                <div class="small text-secondary" style="font-size: 0.75rem;">
                                    Coste: <span
                                        th:text="${#numbers.formatDecimal(p.costeProduccion != null ? p.costeProduccion : 0, 1, 'POINT', 2, 'POINT') + ' €'}">1,65
                                        €</span>
                                    <span th:if="${p.margenBeneficioAplicado != null}">
                                        (<span
                                            th:text="${#numbers.formatDecimal(p.margenBeneficioAplicado, 1, 0)}">100</span>%)
                                    </span>
                                </div>
                            </div>
                            <span class="text-secondary" th:unless="${p.precioSugerido != null}">— Sin calcular —</span>
                        </td>
                        <td>
                            <span class="etiqueta mat-petg" th:if="${p.visible}">Visible</span>
                            <span class="etiqueta" th:unless="${p.visible}">Oculta</span>
                        </td>
                        <td class="align-middle text-center">
                            <div class="d-inline-flex align-items-center gap-1">
                                <!-- Botón restar -->
                                <form th:action="@{/admin/productos/{id}/stock(id=${p.id})}" method="post" class="m-0">
                                    <input type="hidden" name="delta" value="-1" />
                                    <input type="hidden" name="pagina" th:value="${pagina}" />
                                    <input type="hidden" name="q" th:if="${q != null}" th:value="${q}" />
                                    <button type="submit" class="btn btn-outline-secondary btn-sm px-2 py-0"
                                        title="Restar 1">-</button>
                                </form>

                                <!-- Cantidad actual -->
                                <span class="fw-bold px-2" th:text="${stockActual}">0</span>

                                <!-- Botón sumar -->
                                <form th:action="@{/admin/productos/{id}/stock(id=${p.id})}" method="post" class="m-0">
                                    <input type="hidden" name="delta" value="1" />
                                    <input type="hidden" name="pagina" th:value="${pagina}" />
                                    <input type="hidden" name="q" th:if="${q != null}" th:value="${q}" />
                                    <button type="submit" class="btn btn-outline-secondary btn-sm px-2 py-0"
                                        title="Sumar 1">+</button>
                                </form>
                            </div>
                            <div th:if="${stockActual == 0}">
                                <span class="stock-badge stock-badge-cero">Sin stock</span>
                            </div>
                            <div th:if="${stockActual == 1}">
                                <span class="stock-badge stock-badge-uno">Última unidad</span>
                            </div>
                        </td>

                        <td class="text-end">
                            <a th:href="@{/admin/productos/{id}/editar(id=${p.id})}"
                                class="btn btn-sm btn-pill btn-borde">Editar</a>
                            <form th:action="@{/admin/productos/{id}/visibilidad(id=${p.id})}" method="post"
                                class="d-inline">
                                <button type="submit" class="btn btn-sm btn-pill btn-borde"
                                    th:text="${p.visible} ? 'Ocultar' : 'Mostrar'">Ocultar</button>
                            </form>
                            <form th:action="@{/admin/productos/{id}/borrar(id=${p.id})}" method="post" class="d-inline"
                                onsubmit="return confirm('¿Borrar esta pieza y todas sus imágenes?')">
                                <button type="submit" class="btn btn-sm btn-pill btn-borde">Borrar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(productos)}" class="text-secondary p-3 mb-0">Todavía no hay piezas.</p>
        </div>
        <p class="text-secondary small mt-2" th:text="${total} + ' piezas'">0 piezas</p>
        <th:block
            th:replace="~{fragments/paginacion :: paginacion(${pagina}, ${totalPaginas}, '/admin/productos', ${extraPaginacion}, '')}">
        </th:block>
    </main>

    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mi cuenta')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container py-4">
        <span class="deco deco-cuadro" aria-hidden="true"></span>
        <span class="deco deco-circulo" aria-hidden="true"></span>
        <span class="deco deco-triangulo" aria-hidden="true"></span>
        <span class="deco deco-circulo-2" aria-hidden="true"></span>
        <span class="deco deco-cuadro-2" aria-hidden="true"></span>

        <h2 class="titulo-marcador marcador-lila mb-2">Mi cuenta</h2>
        <p class="text-secondary mb-4">Tu rincón en la guarida 💜</p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div class="row g-4">
            <!-- Mis datos -->
            <div class="col-lg-6">
                <div class="auth-card h-100">
                    <h4 class="mb-3">👤 Mis datos</h4>

                    <p class="mb-1 text-secondary">Nombre</p>
                    <p class="fs-5 mb-3" th:text="${usuario.nombre}">Nombre</p>

                    <p class="mb-1 text-secondary">Email</p>
                    <p class="fs-5 mb-3" th:text="${usuario.email}">correo@ejemplo.com</p>

                    <span class="etiqueta">Miembro desde
                        <span th:text="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy')}">01/01/2026</span>
                    </span>

                    <div class="d-grid gap-2 mt-4">
                        <a class="btn btn-pill btn-menta" th:href="@{/favoritos}">♥ Mis favoritos</a>
                        <a class="btn btn-pill btn-borde" th:href="@{/conversaciones}">✉ Mis mensajes</a>
                    </div>
                </div>
            </div>

            <!-- Borrar cuenta: solo usuarios normales -->
            <div class="col-lg-6" th:if="${usuario.rol.name() == 'USUARIO'}">
                <div class="auth-card h-100">
                    <h4 class="mb-3">👋 Irte de la guarida</h4>
                    <p class="text-secondary">
                        Si borras tu cuenta, desaparecen tus favoritos y tus conversaciones. No se puede deshacer.
                    </p>
                    <button type="button" class="btn btn-pill btn-danger w-100 mt-2" data-bs-toggle="modal"
                        data-bs-target="#modalBorrar">
                        Borrar mi cuenta
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de confirmación -->
    <div class="modal fade" id="modalBorrar" tabindex="-1" aria-labelledby="modalBorrarTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="@{/cuenta/borrar}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalBorrarTitulo">¿Seguro que quieres irte? 🥺</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

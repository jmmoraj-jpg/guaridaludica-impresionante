spring:
  application:
    name: guaridaimpresionante
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 50

management:
  endpoints:
    web:
      exposure:
        include: health

